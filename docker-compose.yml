version: '3.8'

services:
  # Your FastAPI Backend
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Hot reload for development
    environment:
      - QDRANT_HOST=qdrant_db
      - QDRANT_PORT=6333
    depends_on:
      - qdrant_db:
          condition: service_healthy

  # Qdrant Vector Database
  qdrant_db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:6333/health" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  qdrant_data:
